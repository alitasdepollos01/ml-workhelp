<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ML WorkHelp</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="themes.css">
<link rel="stylesheet" href="skins.css">
<!-- A host (VS Code, Electron) may load a script before this one that sets
     window.MLHost; without it the page talks to app/serve.py. -->
<script src="js/demo-data.js"></script><script src="js/demo-work.js"></script><script src="demo-host.js"></script><link rel="stylesheet" href="demo.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<main class="app" id="app">
  <section class="desk" id="desk" aria-live="polite">
    <div class="polaroid" id="polaroid" role="button" tabindex="0" aria-pressed="false"
         aria-label="Flip the card to see the romanization and meaning" hidden>
      <div class="flipper">
        <div class="face front">
          <span class="tape" aria-hidden="true"></span>
          <div class="shot"><img id="photo" alt=""></div>
          <div class="caption">
            <p class="th" id="front-th" lang="th"></p>
            <p class="from" id="front-from"></p>
          </div>
        </div>
        <div class="face back" id="back"></div>
      </div>
    </div>
    <div class="notice" id="notice" hidden></div>
  </section>

  <div class="ringer" id="ringer" role="alert" hidden>
    <div>
      <p class="title" id="ringer-title"></p>
      <p class="body" id="ringer-body"></p>
    </div>
    <div class="actions">
      <button type="button" id="ringer-snooze">Snooze 5 min</button>
      <button type="button" id="ringer-stop">Stop</button>
    </div>
  </div>

  <div class="controls" id="controls" hidden>
    <div class="row">
      <button type="button" id="next">Next photo</button>
      <!-- One click to focus; while a timer runs, the chip shows it instead. -->
      <button type="button" id="focus-quick" title="Start the focus timer (its lengths are under Options)">Focus</button>
      <!-- A running alarm or focus timer; opens its section. -->
      <button type="button" class="running-chip" id="alarm-chip" hidden></button>
      <button type="button" class="options-toggle" id="options-toggle" aria-expanded="false" aria-controls="options">Options</button>
    </div>
    <p class="today" id="today" hidden></p>
    <!-- Everything else, one section open at a time, so the sidebar stays short. -->
    <div class="options" id="options" hidden>
      <details class="section" name="options" id="cards-sec">
        <summary>Cards</summary>
        <div class="panel">
          <label class="field">Deck <select id="deck"></select></label>
        </div>
      </details>
      <details class="section" name="options" id="alarm-pop">
        <summary id="alarm-summary">Focus timer and alarm</summary>
        <div class="panel">
          <div id="alarm-set">
            <p class="group">Focus timer: focus, break, repeat</p>
            <div class="trio">
              <label class="field">Focus
                <select id="focus-len">
                  <option value="15">15 min</option>
                  <option value="25">25 min</option>
                  <option value="30">30 min</option>
                  <option value="45">45 min</option>
                  <option value="50">50 min</option>
                  <option value="60">60 min</option>
                  <option value="90">90 min</option>
                </select>
              </label>
              <label class="field">Break
                <select id="break-len">
                  <option value="3">3 min</option>
                  <option value="5">5 min</option>
                  <option value="10">10 min</option>
                  <option value="15">15 min</option>
                </select>
              </label>
              <label class="field" title="Every 4th break is a long one">Long break
                <select id="long-len">
                  <option value="0">Off</option>
                  <option value="15">15 min</option>
                  <option value="20">20 min</option>
                  <option value="30">30 min</option>
                </select>
              </label>
            </div>
            <button type="button" class="wide primary" id="focus-go">Start focus timer</button>
            <hr>
            <label class="field">Or a reminder. What for? <input id="alarm-label" type="text" maxlength="60" placeholder="Optional, e.g. stand-up"></label>
            <div class="chips">
              <button type="button" data-min="5">5 min</button>
              <button type="button" data-min="15">15 min</button>
              <button type="button" data-min="25">25 min</button>
              <button type="button" data-min="50">50 min</button>
            </div>
            <form class="line" id="alarm-min-form">
              <input id="alarm-min" type="number" min="1" max="720" inputmode="numeric" aria-label="Minutes" placeholder="10">
              <span>minutes</span>
              <button type="submit">Start</button>
            </form>
            <form class="line" id="alarm-time-form">
              <span>At</span>
              <input id="alarm-time" type="time" aria-label="Time" required>
              <button type="submit">Set alarm</button>
            </form>
          </div>
          <div id="alarm-running" hidden>
            <p class="status" id="alarm-status"></p>
            <div class="pair">
              <button type="button" id="alarm-pause">Pause</button>
              <button type="button" id="alarm-skip" hidden>Skip</button>
            </div>
            <button type="button" class="wide" id="alarm-cancel">Cancel alarm</button>
          </div>
        </div>
      </details>
      <details class="section" name="options" id="settings-pop">
        <summary>Settings</summary>
        <div class="panel">
          <label class="field">Change photo every
            <select id="interval">
              <option value="20">20 sec</option>
              <option value="45">45 sec</option>
              <option value="120">2 min</option>
              <option value="300">5 min</option>
              <option value="0">Never</option>
            </select>
          </label>
          <label class="field">Change pose every
            <select id="pose">
              <option value="30">30 sec</option>
              <option value="60">1 min</option>
              <option value="120">2 min</option>
              <option value="300">5 min</option>
              <option value="0">Never</option>
            </select>
          </label>
        </div>
      </details>
      <!-- Shown when the host can switch the desktop app's buddies (VS Code, the app's own panel). -->
      <details class="section" name="options" id="buddy-row" hidden>
        <summary>Buddies</summary>
        <div class="panel" role="group" aria-label="Buddies">
          <button type="button" class="toggle wide" id="desk-toggle" aria-pressed="false"
                  title="Milk and Love on your desktop, with a work timer. Drag them to any screen.">Desktop buddy</button>
          <button type="button" class="toggle wide" id="dev-toggle" aria-pressed="false"
                  title="Milk and Love walking round the edges of your editor window">Development buddies</button>
          <button type="button" class="wide quiet" id="hide-toggle"
                  title="For a meeting or sharing your screen; they come back by themselves">Hide them for an hour</button>
        </div>
      </details>
    </div>
  </div>

  <div class="ground" id="ground"></div>
</main>
</body>
</html>
